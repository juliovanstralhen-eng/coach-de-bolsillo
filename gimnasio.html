<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gymnós · Retos del gimnasio</title>
<meta name="theme-color" content="#0F6B6F">
<link rel="icon" href="icons/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#ECEFEE;--surface:#FFFFFF;--sunk:#DDE3E2;--line:#C8D1CF;--ink:#10201F;--muted:#52625F;--accent:#0F6B6F;--accent-ink:#FFFFFF;--accent-soft:#D6ECEB;
  --good:#2E7D3A;--good-soft:#DCEFDD;--warn:#93590A;--warn-soft:#FBEBCF;--bad:#B42318;--bad-soft:#FBE0DD;--go:#F2A516;--go-ink:#1F1300;--go-soft:#FCEFD2;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;--body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--r:10px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1615;--surface:#15201F;--sunk:#0A1110;--line:#263533;--ink:#E4EEEC;--muted:#8FA3A0;--accent:#4FC1BF;--accent-ink:#04201F;--accent-soft:#123634;
  --good:#6BCB77;--good-soft:#15301A;--warn:#F0B34A;--warn-soft:#3A2A0E;--bad:#FF8A7A;--bad-soft:#3D1814;--go:#FFB833;--go-ink:#1F1300;--go-soft:#3A2C0B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1615;--surface:#15201F;--sunk:#0A1110;--line:#263533;--ink:#E4EEEC;--muted:#8FA3A0;--accent:#4FC1BF;--accent-ink:#04201F;--accent-soft:#123634;
  --good:#6BCB77;--good-soft:#15301A;--warn:#F0B34A;--warn-soft:#3A2A0E;--bad:#FF8A7A;--bad-soft:#3D1814;--go:#FFB833;--go-ink:#1F1300;--go-soft:#3A2C0B;color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:34px}h2{font-size:24px}h3{font-size:19px}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase}
.brand b{color:var(--accent)}
.logo{width:34px;height:34px;flex:none}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.btn{font:600 14px/1 var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;min-height:42px;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:34px;padding:0 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:max(16px,1em);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:42px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}.check input{width:auto;min-height:0;margin-top:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer}
.tabs button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);font-size:14px}
.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}.note.good{background:var(--good-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.code{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:30px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}.kpi .l{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}tr.off td{color:var(--muted);text-decoration:line-through}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* Recepción */
.recep{position:fixed;inset:0;z-index:50;background:#0F6B6F;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8vh;text-align:center;
  padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.recep h1{font-size:clamp(28px,5vh,56px)}
.recep .qr{background:#fff;border-radius:18px;padding:12px;width:min(50vh,82vw);aspect-ratio:1;max-width:100%}
.recep .qr svg{width:100%;height:100%;display:block}
.recep .big{font-family:var(--display);font-weight:700;font-size:clamp(44px,9vh,110px);letter-spacing:.18em;line-height:1}
.recep .tbar{width:min(50vh,82vw);height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}.recep .tbar i{display:block;height:100%;background:#F2A516}
.recep .how{font-size:clamp(15px,2.2vh,22px);max-width:46ch;opacity:.92}
.recep .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.15);color:#fff;border-color:transparent}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw}

      if (cerca && g.lat != null && (dist == null || dist > g.radio)) { d.intento.push({usuario: u, ok: false, hora: Date.now()}); W(d); return {ok: false, error: dist == null ? "falta_ubicacion" : "fuera_del_gimnasio", distancia_m: dist}; }
      d.intento.push({usuario: u, ok: true, hora: Date.now()}); const ya = d.asis.some(a => a.gimnasio_id === g.id && a.usuario === u && a.dia === hoy);
      if (!ya) d.asis.push({id: d.seq++, gimnasio_id: g.id, usuario: u, dia: hoy, hora: new Date().toISOString(), distancia_m: dist, anulada: false, motivo: null});
      d.intento = d.intento.filter(t => t.hora > Date.now() - 864e5); W(d); return {ok: true, ya_registrada: ya, dia: hoy, gimnasio: g.nombre}; }
  };
  const USR = new Set(["unirse_reto", "salir_reto", "mis_retos", "tabla_reto", "registrar_asistencia"]);
  async function call(fn, args){ if (live) return rpc(fn, args, USR.has(fn)); try { return await demo[fn](args || {}); } catch (e) { if (e.code) throw e; throw e; } }
  return {live, call, codigo, qrTexto, leerQR, ERR, msg: e => (e && (ERR[e.code] || e.message)) || ERR.red};
})();
</script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "gymnos-panel-clave";

let clave = lsG(KEY), G = null, tab = "retos", offset = 0;

const fmtH = t => new Date(t).toLocaleTimeString("es-CO", {hour: "numeric", minute: "2-digit"});
const hoyISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addD = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };

function sheet(html, mount){ const s = $("#sheet"); s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="panel stack">${html}</div></div>`; const el = s.firstElementChild;

async function load(){

  catch (e) { if (e.code === "clave_invalida") { clave = null; lsS(KEY, null); return renderStart(Retos.msg(e)); } $("#view").innerHTML = `<div class="note bad">${esc(Retos.msg(e))}</div><button class="btn" onclick="load()">Reintentar</button>`; }

function renderStart(err){

function render(){

async function renderRetos(){

      : `<div class="card stack"><p>Aún no tienes retos. Un buen primer reto: <b>12 asistencias en un mes</b>, con un premio sencillo como una semana gratis o una sesión con entrenador.</p></div>`}
    <div class="note small">Los premios se entregan por cumplir la meta de asistencias, no por sorteo. Un sorteo con premios necesita autorización de Coljuegos; los concursos por mérito pueden necesitar permiso de la alcaldía. Revisa las bases con tu asesor legal antes de anunciar premios.</div></div>`;
  $("#nuevo").onclick = () => nuevoReto();

  b.querySelectorAll("[data-cartel]").forEach(x => x.onclick = () => cartel(rs.find(r => r.id === x.dataset.cartel)));

    el => el.querySelector("#ok").onclick = async () => { await Retos.call("cerrar_reto", {p_clave: clave, p_reto: x.dataset.cerrar}); $("#sheet").innerHTML = ""; renderRetos(); }));

function nuevoReto(){

    <label class="check"><input type="checkbox" id="rg" ${G.lat == null ? "disabled" : ""}><span><b>Exigir ubicación</b> (más control)<br><span class="small muted">${G.lat == null ? "Primero guarda la ubicación del gimnasio en Ajustes." : `Además del código, el celular debe estar a menos de ${G.radio} m del gimnasio.`}</span></span></label>
    <div id="rmsg"></div><button class="btn primary" id="crear">Crear reto</button>`, el => {
    el.querySelector("#crear").onclick = async () => {
      const t = el.querySelector("#rt").value.trim(), i = el.querySelector("#ri").value, f = el.querySelector("#rf").value, m = +el.querySelector("#rm").value;

        $("#sheet").innerHTML = ""; toast(`Reto creado. Código para unirse: ${r.codigo}`); renderRetos(); }

async function tabla(r){

  const csv = "puesto,alias,asistencias,cumplio\n" + xs.map((x, i) => `${i + 1},"${x.alias.replace(/"/g, "'")}",${x.asistencias},${x.asistencias >= r.meta ? "si" : "no"}`).join("\n");

    ${xs.length ? `<div class="tbl"><table><thead><tr><th class="num">#</th><th>Participante</th><th class="num">Asistencias</th><th style="min-width:120px">Avance</th><th></th></tr></thead><tbody>${xs.map((x, i) => `<tr><td class="num">${i + 1}</td><td>${esc(x.alias)}</td><td class="num">${x.asistencias}</td><td><div class="bar"><i style="width:${Math.min(100, x.asistencias / r.meta * 100)}%"></i></div></td><td>${x.asistencias >= r.meta ? `<span class="chip good">Cumplió</span>` : ""}</td></tr>`).join("")}</tbody></table></div>`
      : `<p>Todavía no hay inscritos. Comparte el código <b>${esc(r.codigo)}</b> o muestra el cartel en la recepción.</p>`}
    ${xs.length ? `<button class="btn" id="csv" style="align-self:flex-start">Copiar tabla (para Excel)</button>` : ""}`, el => {
    const c = el.querySelector("#csv"); c && (c.onclick = () => navigator.clipboard.writeText(csv).then(() => toast("Tabla copiada"), () => toast("No se pudo copiar")));
  });

function qrSVG(text){ const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({cellSize: 8, margin: 2, scalable: true}); }
function cartel(r){
  sheet(`<div class="row between"><h2>Cartel para unirse</h2><button class="btn small" data-close>Cerrar</button></div>

      ${r.premio ? `<p><b>Premio:</b> ${esc(r.premio)}</p>` : ""}<p>Cumple <b>${r.meta} asistencias</b> entre el ${fmtD(r.inicio)} y el ${fmtD(r.fin)}.</p>

async function renderAsis(){
  const b = $("#body"); b.innerHTML = `<p class="muted">Cargando…</p>`;
  let xs; try { xs = await Retos.call("asistencias_gimnasio", {p_clave: clave}); } catch (e) { b.innerHTML = `<div class="note bad">${esc(Retos.msg(e))}</div>`; return; }

    <p class="small muted">Cada asistencia se registró con el código de la recepción en su momento. Si alguna te parece dudosa (por ejemplo, alguien que no viste en el gimnasio), compárala con tu control de acceso y anúlala: deja de contar para los retos.</p>
    ${xs.length ? `<div class="tbl"><table><thead><tr><th>Participante</th><th>Día</th><th>Hora</th><th class="num">Distancia</th><th></th></tr></thead><tbody>${xs.map(x => `<tr class="${x.anulada ? "off" : ""}"><td>${esc(x.alias)}</td><td>${fmtD(x.dia)}</td><td>${fmtH(x.hora)}</td><td class="num">${x.distancia_m != null ? x.distancia_m + " m" : "—"}</td><td>${x.anulada ? `<button class="btn small ghost" data-re="${x.id}" title="${esc(x.motivo || "")}">Reactivar</button>` : `<button class="btn small ghost" data-an="${x.id}">Anular</button>`}</td></tr>`).join("")}</tbody></table></div>` : `<p>Aún no hay asistencias registradas.</p>`}</div>`;
  b.querySelectorAll("[data-an]").forEach(x => x.onclick = () => sheet(`<h2>Anular asistencia</h2><label class="field">Motivo (solo lo ves tú)<input id="mo" maxlength="120" placeholder="Ej.: no ingresó por el torniquete"></label><div class="row"><button class="btn" data-close>Cancelar</button><button class="btn acc" id="ok">Anular</button></div>`,
    el => el.querySelector("#ok").onclick = async () => { await Retos.call("anular_asistencia", {p_clave: clave, p_id: +x.dataset.an, p_motivo: el.querySelector("#mo").value, p_anular: true}); $("#sheet").innerHTML = ""; renderAsis(); }));
  b.querySelectorAll("[data-re]").forEach(x => x.onclick = async () => { await Retos.call("anular_asistencia", {p_clave: clave, p_id: +x.dataset.re, p_anular: false}); renderAsis(); });
}
function renderAjustes(){
  $("#body").innerHTML = `<div class="stack" style="max-width:640px">
    <div class="card stack"><h3>Ubicación del gimnasio</h3>
      <p class="small muted">Sirve para los retos que exigen ubicación: la asistencia solo cuenta si el celular está cerca. Guárdala estando dentro del gimnasio.</p>
      <p>${G.lat != null ? `Guardada · radio de <b>${G.radio} m</b>` : "Sin guardar"}</p>
      <label class="field">Radio permitido<select id="rad">${[100,150,200,300,500].map(v => `<option ${v === G.radio ? "selected" : ""} value="${v}">${v} m</option>`).join("")}</select></label>
      <button class="btn acc" id="geo" style="align-self:flex-start">Estoy en el gimnasio: usar mi ubicación</button><div id="gmsg" class="small"></div></div>
    <div class="card stack"><h3>Plan</h3><p>${G.miembros} de ${G.cupo} afiliados inscritos en retos.</p></div>
    <div class="card stack"><h3>Sesión del panel</h3><p class="small muted">Para usar el panel en otro equipo, entra con la misma clave.</p><button class="btn ghost" id="out" style="align-self:flex-start">Cerrar sesión en este equipo</button></div></div>`;

      () => { $("#gmsg").textContent = "No pudimos obtener la ubicación. Revisa los permisos de ubicación del navegador."; }, {enableHighAccuracy: true, timeout: 15000});
  };
  $("#out").onclick = () => { clave = null; lsS(KEY, null); renderStart(); };
}
/* ---------- Pantalla de recepción: QR y código que cambian cada 30 s ---------- */
let rT = 0, rV = -1, wake = null;
async function openRecep(){
  try { G = await Retos.call("datos_gimnasio", {p_clave: clave}); offset = G.ahora_ms - Date.now(); } catch (e) { toast(Retos.msg(e)); return; }
  const R = $("#recep"); R.hidden = false; rV = -1;
  R.innerHTML = `<button class="btn small x" id="rx">Salir</button><div class="eyebrow" style="color:#fff;opacity:.8">${esc(G.nombre)}</div><h1>Registra tu asistencia</h1>
    <div class="qr" id="rqr" aria-label="Código QR de asistencia"></div><div class="big" id="rcod" aria-live="polite">------</div><div class="tbar"><i id="rbar"></i></div>
    <p class="how">Abre Gymnós › Hoy › <b>Registrar asistencia</b> y escanea el código. Si la cámara no funciona, escribe los 6 números. Cambian cada 30 segundos.</p>`;
  $("#rx").onclick = closeRecep;
  try { await R.requestFullscreen?.(); } catch (e) {}
  try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {}
  clearInterval(rT); rT = setInterval(tick, 250); tick();
}
async function tick(){
  const now = Date.now() + offset, v = Math.floor(now / 30000), left = 30 - (now / 1000) % 30;
  const bar = $("#rbar"); if (bar) bar.style.width = (left / 30 * 100) + "%";
  if (v !== rV) { rV = v; const c = await Retos.codigo(G.secreto, v); $("#rqr").innerHTML = qrSVG(Retos.qrTexto(G.id, c)); $("#rcod").textContent = c.slice(0, 3) + " " + c.slice(3); }
}
