<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Entrenador personal y nutricionista: plan progresivo, rutina guiada, técnica animada, progreso y recetas.">
<meta name="theme-color" content="#ECEFEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1615" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.PWA_MODE = true; window.APP_VERSION = "4.3";</script>
<title>Coach de Bolsillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de app móvil (máx. 560 px) con barra de pestañas fija abajo; tarjetas solo para ejercicios y paneles que se operan. */
:root{
  --bg:#ECEFEE; --surface:#FFFFFF; --sunk:#DDE3E2; --line:#C8D1CF;
  --ink:#10201F; --muted:#52625F; --accent:#0F6B6F; --accent-ink:#FFFFFF; --accent-soft:#D6ECEB;
  --good:#2E7D3A; --good-soft:#DCEFDD; --warn:#93590A; --warn-soft:#FBEBCF; --bad:#B42318; --bad-soft:#FBE0DD;
  --fig:#33433F; --fig2:#A3B2AF; --prop:#7A8A87;
  --go:#F2A516; --go-ink:#1F1300; --go-soft:#FCEFD2; --cloth:#3B4650; --cloth2:#59656F; --mus:#D9364F;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1615; --surface:#15201F; --sunk:#0A1110; --line:#263533;
  --ink:#E4EEEC; --muted:#8FA3A0; --accent:#4FC1BF; --accent-ink:#04201F; --accent-soft:#123634;
  --good:#6BCB77; --good-soft:#15301A; --warn:#F0B34A; --warn-soft:#3A2A0E; --bad:#FF8A7A; --bad-soft:#3D1814;
  --fig:#C6D6D3; --fig2:#4E605D; --prop:#7D908D; --go:#FFB833; --go-ink:#1F1300; --go-soft:#3A2C0B; --cloth:#56636E; --cloth2:#3E4952; --mus:#FF6B80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1615; --surface:#15201F; --sunk:#0A1110; --line:#263533;
  --ink:#E4EEEC; --muted:#8FA3A0; --accent:#4FC1BF; --accent-ink:#04201F; --accent-soft:#123634;
  --good:#6BCB77; --good-soft:#15301A; --warn:#F0B34A; --warn-soft:#3A2A0E; --bad:#FF8A7A; --bad-soft:#3D1814;
  --fig:#C6D6D3; --fig2:#4E605D; --prop:#7D908D; --go:#FFB833; --go-ink:#1F1300; --go-soft:#3A2C0B; --cloth:#56636E; --cloth2:#3E4952; --mus:#FF6B80; color-scheme:dark}
*{box-sizing:border-box}
/* Identidad propia. Psicología del color: verde petróleo = calma, salud y confianza (información y técnica); ámbar = energía y optimismo (solo la acción principal y el progreso de hoy); verde = logro (series hechas, récords). */
.hero{display:flex;flex-direction:column;gap:12px;border-color:transparent;background:linear-gradient(160deg,var(--go-soft),var(--surface) 70%)}
.hero h1{font-size:40px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.meta b{font-family:var(--display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:3px}
.prog{height:12px;border-radius:999px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--go);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1),background .3s}
.prog.full i{background:var(--good)}
.week{display:flex;gap:6px;align-items:center}
.week i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.week i.on{background:var(--good);border-color:var(--good)}
.week i.on::after{content:"";width:8px;height:5px;border:2.5px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.motiv{font-size:14.5px}
.ex.complete{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.ex:not(.complete) .okchip{display:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.done[aria-pressed="true"]{animation:pop .35s ease-out}
.pr{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;background:var(--good-soft)}
.pr b{font-family:var(--display);font-size:18px;color:var(--good)}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.topbar .chip{white-space:nowrap}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{white-space:nowrap;font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.brand b{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink);font-size:12.5px;font-weight:600;border:1px solid transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.section{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.note{padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);font-size:14px}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.note.good{background:var(--good-soft)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--go-ink)}
.btn.primary{background:var(--go);color:var(--go-ink);border-color:var(--go);font-weight:700;letter-spacing:.01em}
.btn.primary:hover{filter:brightness(1.05)}
.btn.big{min-height:54px;font-size:17px}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:42px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;padding:0;accent-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;flex:none}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:1.5px dotted currentColor;cursor:help}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.hand{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hand:last-child{border-bottom:0}
.hand>div:first-child{min-width:0}
.hand .ctl{display:flex;align-items:center;gap:8px}
.hand .ctl button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:600}
.hand .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.hand .bar i{display:block;height:100%;background:var(--good)}
.shop label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.shop label:has(input:checked) span{text-decoration:line-through;color:var(--muted)}
.stepbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px}
.stepbars div{background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.stepbars.l{height:auto;align-items:start}
details.card>summary{list-style-position:inside}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
.opt input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.bigopt span{flex-direction:column;align-items:flex-start;justify-content:center;border-radius:var(--r);padding:10px 14px;min-height:64px;width:100%}
.bigopt{flex:1 1 140px}
.bigopt small{font-weight:400;font-size:12.5px;opacity:.8}
/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
/* Exercises */
.ex{display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-title{min-width:0}
.rx{display:flex;flex-wrap:wrap;gap:6px}
.sug{font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.sug b{font-family:var(--display);font-size:18px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 1fr 44px;gap:6px;align-items:center}
.sets .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sets input{min-height:40px;padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.setn{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.done{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.done[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.done svg{width:18px;height:18px}
.restbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:24;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.restbar .in{max-width:528px;margin:0 auto 8px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.restbar .t{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--sunk) 70%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .grab{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--bg);padding-block:6px 10px;z-index:2}
.anim{width:100%;aspect-ratio:320/230;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:block}
.phase{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.phase b{color:var(--ink)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.diag button{width:100%;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.diag .ans{padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:5px}
.chart{width:100%;height:auto;display:block}
.vol{display:grid;grid-template-columns:96px 1fr 34px;gap:6px 10px;align-items:center;font-size:13px}
.vol .bar{position:relative;height:14px;background:var(--sunk);border-radius:4px}
.vol .band{position:absolute;top:0;bottom:0;background:var(--good-soft);border-left:1px dashed var(--good);border-right:1px dashed var(--good)}
.vol .fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent);border-radius:3px}
.daylist{display:flex;flex-direction:column;gap:10px}
.day{border-left:3px solid var(--line);padding:4px 0 4px 12px}
.day.next{border-left-color:var(--accent)}
.lib{display:flex;flex-direction:column}
.lib button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none}
.recipe h3{font-size:20px}
.macros{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.macros span b{font-family:var(--display);font-size:17px}
.steps-on{display:flex;gap:6px}
.steps-on i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps-on i.on{background:var(--accent)}
.hide{display:none!important}
.figbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:0 12px;font-size:13px;font-weight:600;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.swatches{display:flex;gap:8px}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--mus);vertical-align:-2px;margin-right:4px}
.legend i.soft{opacity:.45}
.wp{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 20px)}
.wp .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wpanim{height:min(28vh,210px);width:auto;max-width:100%;margin:0 auto}
.counter{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:170px;border-radius:20px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:112px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);touch-action:manipulation;user-select:none}
.counter small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);margin-top:6px;letter-spacing:0}
.counter:active{transform:scale(.985);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.rbtn{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:26px;font-weight:600;line-height:1}
.ring{display:block;margin:0 auto;max-width:100%}
.eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eqcard{position:relative;display:flex;flex-direction:column;gap:8px;padding:10px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;min-width:0}
.eqcard input{position:absolute;opacity:0;pointer-events:none}
.eqimg{display:block;color:var(--fig);background:var(--sunk);border-radius:8px;padding:8px}
.eqimg svg{display:block;width:100%;height:auto;aspect-ratio:64/48}
.eqimg .pad{fill:var(--accent-soft);stroke:var(--accent)}
.eqtxt b{display:block;font-size:14px;line-height:1.25;padding-right:22px}
.eqtxt small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:3px}
.eqcard::after{content:"";position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--accent-ink)}
.eqcard:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.eqcard:has(input:checked)::after{content:"✓";background:var(--accent);border-color:var(--accent)}
.book details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 14px}
.book summary{cursor:pointer;padding:12px 0;font-weight:600;display:flex;justify-content:space-between;gap:10px;list-style:none}
.book summary::-webkit-details-marker{display:none}
.book details[open] summary{border-bottom:1px solid var(--line)}
.book .body{padding:12px 0}
@media (max-width:350px){.eqgrid{grid-template-columns:1fr}}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>


<div class="wrap" id="app">
  <header class="topbar">
    <div class="brand">Coach <b>de bolsillo</b></div>
    <span class="chip" id="syncChip" title="Dónde se guardan tus datos">En este equipo</span>

/* Proporciones antropométricas (estatura ≈ 189 px): muslo .245H, pierna .246H, tronco .30H, brazo .19H, antebrazo .15H */
const FLOOR = 206, AH = 7;
const L = {th:48, sh:47, t:58, neck:7, head:11, ua:36, fa:29, hand:8};
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const lerp = (a, b, k) => a + (b - a) * k;
const lp = (A, B, k) => [lerp(A[0], B[0], k), lerp(A[1], B[1], k)];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const mul = (v, f) => [v[0] * f, v[1] * f];
const unit = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
const up = (o, len, ang) => [o[0] + len * Math.sin(rad(ang)), o[1] - len * Math.cos(rad(ang))];   // 0 = arriba, + = hacia delante
const dn = (o, len, ang) => [o[0] + len * Math.sin(rad(ang)), o[1] + len * Math.cos(rad(ang))];   // 0 = abajo, + = hacia delante
/* Cinemática inversa de 2 segmentos: la articulación media se dobla hacia "pref" */
function ik2(a, b, l1, l2, pref){
  const dx = b[0] - a[0], dy = b[1] - a[1], d0 = Math.hypot(dx, dy) || 1e-6, ux = dx / d0, uy = dy / d0;
  if (d0 >= l1 + l2 - .01) return {m: [a[0] + ux * l1, a[1] + uy * l1], e: [a[0] + ux * (l1 + l2), a[1] + uy * (l1 + l2)]};
  const d = Math.max(d0, Math.abs(l1 - l2) + .01), x = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - x * x));
  const base = [a[0] + ux * x, a[1] + uy * x], m1 = [base[0] - uy * h, base[1] + ux * h], m2 = [base[0] + uy * h, base[1] - ux * h];
  const dot = m => (m[0] - base[0]) * pref[0] + (m[1] - base[1]) * pref[1];
  return {m: dot(m1) >= dot(m2) ? m1 : m2, e: b};
}
const knee = (hip, ankle, pref = [1, 0]) => ik2(hip, ankle, L.th, L.sh, pref).m;
function arm(sh, grip, pref){ const r = ik2(sh, grip, L.ua, L.fa + L.hand, pref); return {elbow: r.m, grip: r.e}; }
function trunk(hip, a, tilt = 0){ const sh = up(hip, L.t, a); return {sh, head: up(sh, L.neck + L.head, a + tilt), ta: a}; }
const front = (hip, sh) => { const u = unit(hip, sh); return [-u[1], u[0]]; };   // lado del pecho
const onTrunk = (j, along, out) => add(lp(j.hip, j.sh, along), mul(front(j.hip, j.sh), out));
/* Pie: ang 0 = plano mirando adelante; + = punta hacia abajo (flexión plantar) */
function foot(ankle, ang){ const r = rad(ang), R = ([x, y]) => [ankle[0] + x * Math.cos(r) - y * Math.sin(r), ankle[1] + x * Math.sin(r) + y * Math.cos(r)]; return {heel: R([-6, 7]), toe: R([21, 6]), ball: R([16, 7])}; }
const ankleFromBall = (ball, ang) => { const r = rad(ang); return [ball[0] - (16 * Math.cos(r) - 7 * Math.sin(r)), ball[1] - (16 * Math.sin(r) + 7 * Math.cos(r))]; };
const shinFoot = (kn, an, plantar = 0) => { const u = unit(kn, an); return deg(Math.atan2(-u[0], u[1])) + plantar; };
const MID = ax => ax + 8;                       // medio del pie
const standAnkle = (ax = 160) => [ax, FLOOR - AH];
/* Centro de masa aproximado (fracciones de Dempster) */
function comX(j, load){
  const m2 = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const parts = [[.08, j.head], [.5, m2(j.hip, j.sh)], [.1, m2(j.hip, j.knee)], [.1, m2(j.hip, j.knee2 || j.knee)], [.06, m2(j.knee, j.ankle)], [.06, m2(j.knee2 || j.knee, j.ankle2 || j.ankle)], [.05, j.elbow], [.05, j.elbow2 || j.elbow]];
  if (load) parts.push(load);
  let m = 0, x = 0; parts.forEach(([w, p]) => { m += w; x += w * p[0]; }); return x / m;
}
/* Busca el parámetro que deja el punto elegido sobre el medio del pie */
function balance(f, lo, hi, target, pick){
  let a = lo, b = hi, fa = pick(f(a)) - target;
  for (let i = 0; i < 28; i++) { const m = (a + b) / 2, fm = pick(f(m)) - target; if (Math.sign(fm) === Math.sign(fa)) { a = m; fa = fm; } else b = m; }
  return f((a + b) / 2);
}
const ezc = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

function weeklySummary(){

async function compressImage(file){

  return out;
}

  navigator.serviceWorker.register("./sw.js").then(reg => {
    reg.addEventListener("updatefound", () => { const w = reg.installing; w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) toast("Nueva versión lista: cierra y abre la app"); }); });
  }).catch(() => {});
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
